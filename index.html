n the morning of the ides of March. What makes this passage chilling?","choices":["Caesar is about to betray the conspirators himself","Caesar's casual, friendly manner with a man who will help kill him within hours; the dramatic irony is at its most intense","Caesar is warning them that he knows about the plot","Caesar is drunk and does not recognize the conspirators"],"correct":1,"cat":"Quote ID & Plot"},{"num":201,"q":"Which characters die by suicide or self-directed death in Julius Caesar?","choices":["Only Brutus","Only Cassius","Caesar, Cassius, and Brutus","Titinius, Cassius, and Brutus"],"correct":3,"cat":"Quote ID & Plot"},{"num":202,"q":"How does Antony describe his attitude toward Lepidus to Octavius in Act 4.1?","choices":["As a trusted equal partner in governance","As a useful but expendable tool, like a horse or pack animal to be used and discarded","As a dangerous rival who must be watched carefully","As a loyal friend who deserves all the honors of their alliance"],"correct":1,"cat":"Quote ID & Plot"},{"num":203,"q":"Antony compares Lepidus to a horse. What is the core point of this metaphor?","choices":["Lepidus is fast and useful in battle","Lepidus is powerful but untamed","Lepidus is a creature to be trained, directed, and discarded when no longer useful, with no more status than a horse","Lepidus will carry messages reliably"],"correct":2,"cat":"Quote ID & Plot"},{"num":204,"q":"In Act 5.1, Octavius insists on leading the right side of the battle formation, against Antony's instruction. This minor conflict suggests what about their alliance?","choices":["They are perfectly aligned in their goals","There is an undercurrent of rivalry and competition for control, foreshadowing their eventual historical conflict","Octavius is a stronger general than Antony","They are following standard Roman military protocol"],"correct":1,"cat":"Quote ID & Plot"},{"num":205,"q":"Antony calls Lepidus 'slight and unmeritable'; Octavius calls him 'a tried and valiant soldier.' This exchange shows what contrast?","choices":["Octavius values loyalty over political calculation; Antony is purely cynical","Antony is more strategically ruthless and willing to use people; Octavius is more just in his assessments of others","Antony likes Lepidus personally; Octavius does not","Octavius is older and wiser than Antony"],"correct":1,"cat":"Quote ID & Plot"},{"num":206,"q":"How many total times does Caesar encounter the warning 'Beware the ides of March' or a variant of it?","choices":["Once, from the Soothsayer","Twice: Soothsayer in Act 1 and Artemidorus's letter","Three times: from the Soothsayer in Act 1, from Artemidorus, and from the Soothsayer again as he enters the Senate in Act 3","Four times including Calphurnia"],"correct":2,"cat":"Quote ID & Plot"},{"num":207,"q":"Calphurnia says she 'never stood on ceremonies / Yet now they fright me' and describes horrors. What is the dramatic purpose?","choices":["To slow the action down before the climax","To heighten tension before the assassination by showing that even a non-superstitious person is alarmed, suggesting the omens are genuine","To show Rome is a dangerous place at night","To introduce the theme of witchcraft"],"correct":1,"cat":"Quote ID & Plot"},{"num":208,"q":"Who was Portia's father, and why does she invoke him when arguing with Brutus?","choices":["Pompey, to show noble military blood","Cato, a man famous for unbending Stoic virtue and political integrity, to show she has the strength to be trusted with Brutus's secrets","Caesar, ironically, to show political connections","Cicero, to show she has the gift of rhetoric"],"correct":1,"cat":"Quote ID & Plot"},{"num":209,"q":"What is the name of Cassius's slave who guides the sword that kills Cassius?","choices":["Titinius","Strato","Pindarus","Lucilius"],"correct":2,"cat":"Quote ID & Plot"},{"num":210,"q":"Where does the final battle of the play take place?","choices":["Rome","Sardis","Philippi","Gaul"],"correct":2,"cat":"Quote ID & Plot"},{"num":211,"q":"After Caesar's ghost vanishes, Brutus says 'Now I have taken heart, thou vanishest.' What does 'taken heart' mean here?","choices":["He has taken courage now that the ghost is gone","He has taken Caesar's heart as a metaphor for regret","He has regained his resolve to fight at Philippi","He now believes the ghost was an illusion"],"correct":0,"cat":"Quote ID & Plot"},{"num":212,"q":"Antony says 'The evil that men do lives after them; / The good is oft interred with their bones. / So let it be with Caesar.' How is Antony using this statement rhetorically?","choices":["He is being honest about Caesar's flaws","He is pretending to agree that Caesar's evil lives on while systematically undermining that claim by listing Caesar's virtues, making the audience question the premise","He is trying to excuse his own future actions","He is quoting a popular Roman proverb to appear educated"],"correct":1,"cat":"Quote ID & Plot"},{"num":213,"q":"Caesar's murder takes place at the base of Pompey's statue. What is the significance of this location?","choices":["Pompey's statue was the only place where assassination was legally permitted","It is ironic: Caesar, who defeated Pompey, is murdered under Pompey's gaze, as if Pompey's spirit has taken revenge","The conspirators chose it randomly","It was the only private place in the Senate"],"correct":1,"cat":"Quote ID & Plot"},{"num":214,"q":"Strato says 'For Brutus only overcame himself, / And no man else hath honor by his death.' What does this mean?","choices":["Brutus was his own greatest enemy","Brutus died by his own hand; no external force defeated him, so no one can claim credit for conquering him","Brutus's death was meaningless","Strato is criticizing Brutus for committing suicide"],"correct":1,"cat":"Quote ID & Plot"},{"num":215,"q":"Which conspirator's name is the same as an innocent poet who is attacked and nearly torn apart by the mob in Act 3.3?","choices":["Casca","Brutus","Cinna","Decius"],"correct":2,"cat":"Quote ID & Plot"},{"num":266,"q":"Which of the following best explains why Brutus is considered a tragic hero in the Aristotelian sense?","choices":["He is betrayed by his closest friend","He is a noble man whose fatal flaw — idealism divorced from practical wisdom — leads directly to his own destruction","He is punished by the gods for committing murder","He is simply unlucky in battle"],"correct":1,"cat":"Advanced Questions"},{"num":267,"q":"Antony's technique of repeating 'Brutus is an honorable man' while systematically undermining that claim is best described as:","choices":["Synecdoche","Occupatio combined with irony: pretending to defend someone while actually destroying their credibility","Enthymeme with a missing premise","Anaphora for emotional effect only"],"correct":1,"cat":"Advanced Questions"},{"num":268,"q":"Shakespeare uses the Latin phrase 'Et tu, Brutè' even though the rest of the play is in English. The most likely reason is:","choices":["Shakespeare did not know the English equivalent","The Latin is historically authentic and lends Caesar's dying words a timeless, universal quality; it was already famous from historical accounts","Latin was considered more poetic than English","Caesar could only speak Latin"],"correct":1,"cat":"Advanced Questions"},{"num":269,"q":"In the quarrel scene, Brutus says he will treat Cassius's bad behavior as 'dishonor shall be humor.' What does 'humor' mean here?","choices":["Something funny","One of the four bodily fluids affecting personality; Brutus means he will treat it as a mood flaw, not a real dishonor","A comical exaggeration","A theatrical performance"],"correct":1,"cat":"Advanced Questions"},{"num":270,"q":"Casca describes the commoners at the Lupercal as the 'rabblement' who 'threw up their sweaty nightcaps.' What does his language reveal?","choices":["He admires their enthusiasm","He is contemptuous of the lower classes, using language that is disgusted and dismissive","He is neutral, simply describing what he saw","He is envious of their freedom to show emotion publicly"],"correct":1,"cat":"Advanced Questions"},{"num":271,"q":"When Octavius refuses to yield to Antony about the right side of the battlefield in Act 5.1, this suggests what about their triumvirate?","choices":["It is a perfectly equal partnership","Octavius is already establishing dominance and refuses to be subordinate — a sign of future conflict between them","Antony and Octavius have no tension","Octavius is more experienced than Antony"],"correct":1,"cat":"Advanced Questions"},{"num":272,"q":"Which best describes iambic pentameter, the verse form Shakespeare uses?","choices":["Lines with exactly 10 stressed syllables","Lines with five feet, each an unstressed syllable followed by a stressed one (da-DUM), giving 10 syllables per line","Lines with six stressed beats alternating with rests","Lines in rhyming couplets with eight syllables each"],"correct":1,"cat":"Advanced Questions"},{"num":273,"q":"At the start of Act 3.1, Caesar says 'What touches us ourself shall be last served' to Artemidorus. This is deeply ironic because:","choices":["Artemidorus's letter actually praises Caesar","The very thing 'touching Caesar himself' (the assassination plot) is what he refuses to hear; by dismissing the personal matter first, he seals his own fate","Caesar is being politely modest","The letter from Artemidorus is a forgery by the conspirators"],"correct":1,"cat":"Advanced Questions"},{"num":274,"q":"When Antony says 'over thy wounds now do I prophesy' alone with Caesar's body, his use of 'prophesy' suggests:","choices":["He is pretending to have divine powers","He is channeling his grief into an almost oracular proclamation of revenge and civil war, presenting Caesar's spirit as working through him","He is performing a religious ritual","He is warning the conspirators still present"],"correct":1,"cat":"Advanced Questions"},{"num":275,"q":"Brutus calls Portia 'As dear to me as are the ruddy drops / That visit my sad heart' but does not immediately share his secret with her. What does this reveal?","choices":["He does not truly trust Portia despite his words","He loves Portia deeply but separates his domestic and political selves, keeping the conspiracy from her to protect both her and the plot — even as she correctly senses something is wrong","He is planning to tell her eventually","He forgot about the conspiracy for a moment"],"correct":1,"cat":"Advanced Questions"},{"num":276,"q":"Caesar is portrayed as both a great man and as physically weak and vain. What effect does this dual portrayal create?","choices":["It makes Caesar a villain rather than a tragic figure","It creates ambiguity: the assassination of a man who was both great and flawed makes it impossible to simply condemn or endorse the act, placing the moral question in the audience's hands","It excuses the conspirators by showing Caesar deserved to die","It makes Caesar into a purely sympathetic martyr"],"correct":1,"cat":"Advanced Questions"},{"num":277,"q":"The play begins with tribunes controlling crowds and ends with Octavius establishing order over a battlefield. How does this structural choice reinforce the theme of cyclical history?","choices":["It shows Rome is always well-governed","The opening mirrors the closing: power and authority reassert themselves even after violent rupture, suggesting the assassination changes nothing fundamental in how Rome is governed","It shows common people never have power in Rome","It demonstrates Shakespeare's admiration for military government"],"correct":1,"cat":"Advanced Questions"},{"num":278,"q":"'I fear there will a worse come in his place' is spoken by a Plebeian in Act 3.2. What does this presage?","choices":["The crowd has completely lost faith in the conspirators","It foreshadows the civil war and the tyranny that follows: Caesar is replaced not by freedom but by the brutal triumvirate and its proscriptions","The Plebeian is simply mourning Caesar","It is a direct reference to Brutus becoming the new ruler"],"correct":1,"cat":"Advanced Questions"},{"num":279,"q":"'Friends, Romans, countrymen, lend me your ears' is more rhetorically effective than Brutus's opening 'Romans, countrymen, and lovers, hear me for my cause' because:","choices":["It is shorter","Antony puts 'Friends' first, building personal connection before invoking patriotism; Brutus's opening is more formal and distancing","Antony's uses more active verbs","Antony's line rhymes and is therefore more memorable"],"correct":1,"cat":"Advanced Questions"},{"num":280,"q":"Cassius sends forged notes through Brutus's window, pretending they are from various Roman citizens. What does this deception tell us about Cassius's methods?","choices":["Cassius is an honest man who uses conventional persuasion","Cassius is pragmatic and willing to use manipulation and forgery to achieve his goals, contrasting with Brutus's insistence on honor and transparency","Cassius fears that Brutus would refuse a direct request","Cassius is simply saving time"],"correct":1,"cat":"Advanced Questions"},{"num":281,"q":"The Soothsayer in Act 2.4 tells Portia: 'None that I know will be, much that I fear may chance.' What does this maintain about his dramatic role?","choices":["He knows about the conspiracy and has been paid to warn Caesar","He does not know for certain that any harm is planned, but fears something bad will happen; this ambiguity maintains his role as a figure of prophetic dread without directly revealing the plot","He is lying to Portia to protect the conspirators","He knows everything and is being deliberately evasive"],"correct":1,"cat":"Advanced Questions"},{"num":282,"q":"Which of the following is TRUE about the historical Julius Caesar, also portrayed in Shakespeare's play?","choices":["Caesar refused the crown when offered it publicly three times","Caesar defeated Pompey in a civil war before becoming dictator","Caesar was a member of the First Triumvirate with Pompey and Crassus","All of the above"],"correct":3,"cat":"Advanced Questions"},{"num":283,"q":"The Globe Theatre was open-air, performing in daylight. How did Shakespeare convey nighttime scenes without artificial lighting?","choices":["Actors wore black costumes","Through explicit dialogue: characters discuss stars, darkness, torches, and the time, so the audience understood the setting imaginatively","The theatre had a system of curtains that blocked sunlight","Nighttime scenes were never performed at the Globe"],"correct":1,"cat":"Advanced Questions"},{"num":284,"q":"The play is called 'The Tragedy of Julius Caesar,' yet Caesar dies in Act 3 and the last two acts focus on Brutus. Which character more accurately fits the classical tragic hero arc?","choices":["Mark Antony, because he survives and inherits power","Julius Caesar, because the play bears his name","Brutus, because he undergoes the classic arc from admired noble to fallen man, with his internal conflict and ultimate failure at the play's emotional center","Cassius, because he is the architect of events"],"correct":2,"cat":"Advanced Questions"},{"num":285,"q":"Antony calls the conspirators 'the choice and master spirits of this age' in Act 3.1 when he arrives at the Senate. Is he being sincere or ironic?","choices":["Sincere: he genuinely respects them at this moment","Bitterly ironic or sarcastic: calling his friend's killers 'master spirits' is a cutting acknowledgment of their power while actually expressing contempt and grief","Neutral: it is a formal honorific","Uncertain, since Antony's emotions in this scene are unknowable"],"correct":1,"cat":"Advanced Questions"},{"num":286,"q":"Brutus uses a triple rhetorical structure ending in 'as he was ambitious, I slew him.' The use of 'but' before this final clause is meant to:","choices":["Apologize for the killing","Turn all the previous positive statements on their head; ambition negates all Caesar's other virtues in Brutus's argument, making the killing seem not just justified but mandatory","Acknowledge that the killing was wrong","Express Brutus's personal regret"],"correct":1,"cat":"Advanced Questions"},{"num":287,"q":"Which of the following is the best example of a soliloquy in Julius Caesar?","choices":["'Friends, Romans, countrymen, lend me your ears' (spoken to a crowd)","'Et tu, Brutè?' (spoken as Caesar is dying)","'It must be by his death. And for my part / I know no personal cause to spurn at him' (Brutus alone in his orchard)","'The fault, dear Brutus, is not in our stars' (spoken to Brutus)"],"correct":2,"cat":"Advanced Questions"},{"num":288,"q":"'Ate' is invoked by Antony: 'Caesar's spirit, ranging for revenge, / With Ate by his side come hot from hell.' Who or what is Ate?","choices":["A Roman goddess of love","A Greek personification of ruin, delusion, and vengeful destruction","A river in the Roman underworld","An Etruscan war goddess"],"correct":1,"cat":"Advanced Questions"},{"num":289,"q":"Brutus says conspirators' Roman blood is 'guilty of a several bastardy / If he do break the smallest particle / Of any promise.' What does 'several bastardy' mean?","choices":["Each Roman is individually guilty of treachery","Each drop of blood is separately degraded/illegitimized if a promise is broken, meaning the entire Roman heritage is compromised by oath-breaking","A legal term for individual criminal liability","A medical term for blood disease"],"correct":1,"cat":"Advanced Questions"},{"num":290,"q":"Antony says Caesar's will is 'not meet' to be read publicly. In this context, 'meet' means:","choices":["To encounter or come across","Fitting or appropriate","A type of gathering","A sports competition"],"correct":1,"cat":"Advanced Questions"},{"num":291,"q":"Cassius tells Brutus: 'Write them together, yours is as fair a name; / Sound them, it doth become the mouth as well; / Weigh them, it is as heavy; conjure with 'em.' What is the cumulative rhetorical effect of these three comparisons?","choices":["To prove that Cassius himself is better than Caesar","To prove by multiple measures that Brutus's name is equal to Caesar's in every way, and therefore Caesar has no natural right to superiority","To prove that Caesar is a poor name for a Roman ruler","To suggest Brutus should take Caesar's place as ruler"],"correct":1,"cat":"Advanced Questions"},{"num":292,"q":"Portia says: 'Dwell I but in the suburbs / Of your good pleasure? If it be no more, / Portia is Brutus' harlot, not his wife.' What argument is Portia making?","choices":["She is threatening to leave Brutus","She is arguing that a wife not trusted with her husband's secrets occupies only the periphery of marriage, reducing her to less than a wife","She is angry about Brutus neglecting their home","She is challenging Brutus to a debate about marriage"],"correct":1,"cat":"Advanced Questions"},{"num":293,"q":"In Act 1, which character speaks primarily in prose when reporting on the Lupercal events, and what does this suggest about their character?","choices":["Antony, showing his military rather than political nature","Casca, giving his narration a blunt, cynical, down-to-earth quality that contrasts with the more idealistic characters","Brutus, when troubled","Caesar, to show his common touch"],"correct":1,"cat":"Advanced Questions"},{"num":294,"q":"'Let's be sacrificers, but not butchers, Caius. / We all stand up against the spirit of Caesar.' This speech reveals Brutus's tendency to:","choices":["Be unnecessarily violent","Aestheticize the act of murder, viewing the assassination as a ceremonial sacrifice rather than a political killing — which prevents him from being sufficiently ruthless in ensuring its success","Show too much mercy toward his enemies","Consult Cassius before making any decision"],"correct":1,"cat":"Advanced Questions"},{"num":295,"q":"Octavius's final speech ordering Brutus honored like a soldier before saying 'so call the field to rest' strikes what tone?","choices":["Triumphant celebration by Antony and Octavius","Somber, ordered resolution: the chaos of civil war is ended and peace restored, but at great cost, leaving bittersweet rather than triumphant closure","Ongoing threat, since Caesar's spirit still ranges over Rome","Personal grief, since Octavius mourns all those who died"],"correct":1,"cat":"Advanced Questions"},{"num":296,"q":"The word 'honor' is invoked over 50 times in Julius Caesar. All major characters claim to act honorably. What does this proliferation suggest as a theme?","choices":["All the characters are genuinely honorable men","'Honor' is a contested and unstable concept: each character uses it to justify wildly different actions, showing the word itself can be weaponized and that truly honorable action is difficult to define","Roman society was more ethical than modern society","Shakespeare believed honor was the most important virtue"],"correct":1,"cat":"Advanced Questions"},{"num":297,"q":"After Caesar's murder, Brutus tells Antony: 'Our hearts you see not; they are pitiful; / And pity to the general wrong of Rome... Hath done this deed.' What is Brutus's argument?","choices":["He is apologizing to Antony","He claims the conspirators were motivated by pity for Rome, not hatred of Caesar, framing the murder as an act of compassion rather than violence","He is arguing that Antony should join the conspiracy","He is warning Antony to leave Rome immediately"],"correct":1,"cat":"Advanced Questions"},{"num":298,"q":"Caesar dismisses the soothsayer and refuses Artemidorus's letter, ignoring all warnings. 'Hubris' as a concept in tragic literature means:","choices":["Wisdom gained through suffering","Excessive pride or arrogance that causes a great person to ignore warnings and limitations, typically leading to their downfall","The moment of recognition before a tragic hero dies","The conflict between fate and free will"],"correct":1,"cat":"Advanced Questions"},{"num":299,"q":"'There is no terror, Cassius, in your threats, / For I am armed so strong in honesty / That they pass by me as the idle wind, / Which I respect not.' What does this reveal about Brutus's self-image?","choices":["Brutus is boasting recklessly to intimidate Cassius","Brutus genuinely believes his personal integrity is his greatest protection, more powerful than any physical threat; this reveals his idealism and a form of moral pride","Brutus is quoting a famous Roman philosopher","Brutus has already decided to abandon the conspiracy"],"correct":1,"cat":"Advanced Questions"},{"num":300,"q":"Julius Caesar was written approximately in 1599 CE. The events it depicts occurred in 44 BCE. Shakespeare was therefore writing about events roughly how many years in the past?","choices":["About 500 years in the past","About 1,500 years in the past","About 1,643 years in the past","About 750 years in the past"],"correct":2,"cat":"Advanced Questions"}];
</script>
<script id="questions-data"></script>
<script>
// ── STATE ─────────────────────────────────────────────────────────────────
let pool = [];
let qIdx = 0;
let score = 0;
let correct = 0;
let wrong = 0;
let streak = 0;
let timerInterval = null;
let timerSeconds = 20;
let timeLeft = 20;
let answered = false;
let wrongList = [];
let lastSettings = null;
const CIRCUMFERENCE = 2 * Math.PI * 34; // ~213.6

// ── UTILS ─────────────────────────────────────────────────────────────────
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}

function grade(pct) {
  if (pct >= 95) return { emoji: '🏆', label: 'Perfect! You know Julius Caesar cold.', trophy: '🥇' };
  if (pct >= 80) return { emoji: '🎉', label: 'Excellent! Strong command of the material.', trophy: '🏆' };
  if (pct >= 65) return { emoji: '👍', label: 'Good work! A bit more review and you\'ll ace it.', trophy: '🥈' };
  if (pct >= 50) return { emoji: '📚', label: 'Decent effort — review the sections you missed.', trophy: '🥉' };
  return { emoji: '😬', label: 'More study needed. Try a specific category next time!', trophy: '📖' };
}

// ── START ─────────────────────────────────────────────────────────────────
function startGame(repeat) {
  const cat = repeat && lastSettings ? lastSettings.cat : document.getElementById('sel-category').value;
  const count = repeat && lastSettings ? lastSettings.count
    : Math.max(5, Math.min(250, parseInt(document.getElementById('sel-count').value) || 20));
  const doShuffle = repeat && lastSettings ? lastSettings.shuffle
    : document.getElementById('sel-shuffle').checked;
  timerSeconds = repeat && lastSettings ? lastSettings.timer
    : Math.max(5, Math.min(60, parseInt(document.getElementById('sel-timer').value) || 20));

  lastSettings = { cat, count, shuffle: doShuffle, timer: timerSeconds };

  let filtered = cat === 'all' ? ALL_QUESTIONS : ALL_QUESTIONS.filter(q => q.cat === cat);
  if (doShuffle) filtered = shuffle(filtered);
  pool = filtered.slice(0, count);

  // Shuffle answer order per question if needed
  if (doShuffle) {
    pool = pool.map(q => {
      const order = shuffle([0, 1, 2, 3]);
      return {
        ...q,
        choices: order.map(i => q.choices[i]),
        correct: order.indexOf(q.correct),
        _originalOrder: order
      };
    });
  }

  qIdx = 0;
  score = 0;
  correct = 0;
  wrong = 0;
  streak = 0;
  wrongList = [];

  showScreen('quiz-screen');
  renderQuestion();
}

// ── QUESTION ──────────────────────────────────────────────────────────────
function renderQuestion() {
  answered = false;
  const q = pool[qIdx];

  document.getElementById('q-counter').textContent = `${qIdx + 1} / ${pool.length}`;
  document.getElementById('progress-bar').style.width = `${(qIdx / pool.length) * 100}%`;
  document.getElementById('score-display').textContent = score;
  document.getElementById('q-cat').textContent = q.cat;
  document.getElementById('question-text').textContent = `${q.num}. ${q.q}`;

  const icons = ['▲', '◆', '●', '★'];
  const choicesEl = document.getElementById('choices');
  choicesEl.innerHTML = '';
  q.choices.forEach((text, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.innerHTML = `<span class="choice-icon">${icons[i]}</span><span class="choice-text">${text}</span>`;
    btn.onclick = () => selectAnswer(i);
    choicesEl.appendChild(btn);
  });

  const fb = document.getElementById('feedback');
  fb.className = 'feedback';
  document.getElementById('next-btn').className = 'next-btn';

  startTimer();
}

// ── TIMER ─────────────────────────────────────────────────────────────────
function startTimer() {
  clearInterval(timerInterval);
  timeLeft = timerSeconds;
  updateTimerUI();

  timerInterval = setInterval(() => {
    timeLeft--;
    updateTimerUI();
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      if (!answered) timeUp();
    }
  }, 1000);
}

function updateTimerUI() {
  const arc = document.getElementById('timer-arc');
  const num = document.getElementById('timer-num');
  const fraction = timeLeft / timerSeconds;
  arc.style.strokeDashoffset = CIRCUMFERENCE * (1 - fraction);
  num.textContent = timeLeft;
  arc.style.stroke = fraction > 0.4 ? '#f5b800' : fraction > 0.2 ? '#ff8c00' : '#e21b3c';
}

function timeUp() {
  answered = true;
  wrong++;
  streak = 0;
  const q = pool[qIdx];
  revealAnswer(q.correct, -1);
  showFeedback(false, q.choices[q.correct], '⏰ Time\'s up!');
  wrongList.push({ q, yourIdx: -1 });
  document.getElementById('next-btn').className = 'next-btn show';
}

// ── ANSWER ────────────────────────────────────────────────────────────────
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  clearInterval(timerInterval);

  const q = pool[qIdx];
  const isCorrect = idx === q.correct;

  if (isCorrect) {
    const pts = Math.max(100, Math.round(500 * (timeLeft / timerSeconds)));
    score += pts;
    correct++;
    streak++;
    if (streak >= 3) showStreak(streak);
  } else {
    wrong++;
    streak = 0;
    wrongList.push({ q, yourIdx: idx });
  }

  revealAnswer(q.correct, idx);
  showFeedback(isCorrect, q.choices[q.correct]);
  document.getElementById('score-display').textContent = score;
  document.getElementById('next-btn').className = 'next-btn show';
}

function revealAnswer(correctIdx, chosenIdx) {
  const btns = document.querySelectorAll('.choice-btn');
  btns.forEach((btn, i) => {
    btn.disabled = true;
    if (i === correctIdx) btn.classList.add('reveal');
    else if (i === chosenIdx) btn.classList.add('wrong');
    else btn.style.opacity = '0.45';
  });
}

function showFeedback(isCorrect, correctText, prefix) {
  const fb = document.getElementById('feedback');
  const icon = document.getElementById('fb-icon');
  const title = document.getElementById('fb-title');
  const body = document.getElementById('fb-body');

  if (isCorrect) {
    fb.className = 'feedback correct-fb show';
    icon.textContent = '✅';
    title.textContent = `Correct! +${Math.max(100, Math.round(500 * (timeLeft / timerSeconds)))} pts`;
    body.textContent = '';
  } else {
    fb.className = 'feedback wrong-fb show';
    icon.textContent = '❌';
    title.textContent = prefix || 'Wrong!';
    body.textContent = `Correct answer: ${correctText}`;
  }
}

function showStreak(n) {
  const el = document.getElementById('streak-banner');
  el.textContent = n >= 10 ? `🔥🔥 ${n} in a row!!` : `🔥 ${n} in a row!`;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2200);
}

// ── NEXT ──────────────────────────────────────────────────────────────────
function nextQuestion() {
  qIdx++;
  if (qIdx >= pool.length) {
    showResults();
  } else {
    renderQuestion();
    window.scrollTo(0, 0);
  }
}

// ── RESULTS ───────────────────────────────────────────────────────────────
function showResults() {
  const pct = Math.round((correct / pool.length) * 100);
  const g = grade(pct);

  document.getElementById('result-trophy').textContent = g.trophy;
  document.getElementById('result-heading').textContent = `${g.emoji} Quiz Complete!`;
  document.getElementById('r-correct').textContent = correct;
  document.getElementById('r-wrong').textContent = wrong;
  document.getElementById('r-pct').textContent = pct + '%';
  document.getElementById('score-grade').innerHTML = `<span>${pct}% — </span>${g.label}`;

  const missedList = document.getElementById('missed-list');
  missedList.innerHTML = '';
  const ms = document.getElementById('missed-section');

  if (wrongList.length === 0) {
    ms.style.display = 'none';
  } else {
    ms.style.display = 'block';
    document.querySelector('.missed-section h3').textContent = `❌ Missed (${wrongList.length})`;
    wrongList.forEach(({ q, yourIdx }) => {
      const div = document.createElement('div');
      div.className = 'missed-item';
      div.innerHTML = `
        <div class="mq"><strong>Q${q.num}.</strong> ${q.q}</div>
        <div class="mc">
          ${yourIdx >= 0 ? `<span class="your">✗ Your answer: ${q.choices[yourIdx]}</span><br>` : '<span class="your">✗ Timed out</span><br>'}
          <span class="right">✓ Correct: ${q.choices[q.correct]}</span>
        </div>`;
      missedList.appendChild(div);
    });
  }

  document.getElementById('progress-bar').style.width = '100%';
  showScreen('results-screen');
}
</script>
